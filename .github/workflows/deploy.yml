name: Déploiement

# Publie le build statique sur GitHub Pages. Le déclenchement automatique est
# limité à `main` : une branche de travail ne doit jamais remplacer le site
# public. `workflow_dispatch` permet de rejouer un déploiement à l'identique
# sans nouveau commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les exécutions en attente sont remplacées
# par la plus récente, mais celle qui est en cours va à son terme pour ne pas
# laisser le site à moitié publié.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # `base_path` vaut `/modrise` pour un site de projet et `/` pour un
        # domaine dédié : la valeur vient de GitHub, elle n'est pas devinée.
        # `vite.config.ts` la normalise (voir `resolveBase`).
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
